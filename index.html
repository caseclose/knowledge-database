<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <title>knowledge-database</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="vue.css" />
  <script>
    (function () {
      var saved;
      try { saved = localStorage.getItem("kb-theme"); } catch (e) {}
      var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      var theme = saved || (prefersDark ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <style>
    :root {
      --theme-color: #2c7be5;
      --accent: #2c7be5;
      --bg: #ffffff;
      --bg-secondary: #f8fafc;
      --text: #2c3e50;
      --text-heading: #1a202c;
      --text-muted: #4a5568;
      --border: #e2e8f0;
      --code-bg: #1e293b;
      --code-text: #e2e8f0;
      --inline-code-bg: #f1f5f9;
      --inline-code-text: #e53e3e;
      --table-header-bg: #edf2f7;
      --table-even-bg: #f8fafc;
      --blockquote-bg: #f0f7ff;
      --blockquote-text: #4a5568;
      --sidebar-bg: #ffffff;
      --sidebar-text: #4a5568;
      --search-bg: #f1f5f9;
      --mermaid-bg: #f8fafc;
      --mermaid-border: #e2e8f0;
      --shadow: rgba(30, 41, 59, 0.12);
    }

    [data-theme="dark"] {
      --theme-color: #60a5fa;
      --accent: #60a5fa;
      --bg: #0f172a;
      --bg-secondary: #1e293b;
      --text: #cbd5e1;
      --text-heading: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #334155;
      --code-bg: #0d1117;
      --code-text: #e2e8f0;
      --inline-code-bg: #1e293b;
      --inline-code-text: #f87171;
      --table-header-bg: #1e293b;
      --table-even-bg: #0f172a;
      --blockquote-bg: #1e293b;
      --blockquote-text: #94a3b8;
      --sidebar-bg: #0f172a;
      --sidebar-text: #94a3b8;
      --search-bg: #1e293b;
      --mermaid-bg: #1e293b;
      --mermaid-border: #334155;
      --shadow: rgba(0, 0, 0, 0.3);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-text-size-adjust: 100%;
      text-rendering: optimizeLegibility;
      color: var(--text);
      background: var(--bg);
    }

    .markdown-section {
      color: var(--text);
      max-width: 900px;
    }

    .markdown-section a {
      color: var(--accent);
    }

    .markdown-section p {
      color: var(--text);
    }

    /* 行内代码 */
    .markdown-section code {
      font-family: "SF Mono", "JetBrains Mono", "Fira Code", Menlo, Monaco,
        Consolas, monospace;
      background: var(--inline-code-bg);
      color: var(--inline-code-text);
      border-radius: 4px;
      padding: 2px 6px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* 代码块容器 */
    .markdown-section pre {
      background: var(--code-bg);
      border-radius: 10px;
      padding: 2.2em 0 1.3em;
      margin: 1.6em 0;
      box-shadow: 0 4px 14px var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .markdown-section pre code {
      background: transparent;
      color: var(--code-text);
      padding: 0 1.6em;
      font-size: 0.9em;
      line-height: 1.65;
      font-family: "SF Mono", "JetBrains Mono", "Fira Code", Menlo, Monaco,
        Consolas, monospace;
    }

    /* 语言标签徽章（左上角） */
    .markdown-section pre[data-lang]::before {
      content: attr(data-lang);
      position: absolute;
      top: 0;
      left: 0;
      padding: 3px 12px;
      font-size: 0.7em;
      font-family: "SF Mono", "JetBrains Mono", Menlo, monospace;
      color: #64748b;
      background: rgba(0, 0, 0, 0.25);
      border-bottom-right-radius: 8px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      font-weight: 600;
      z-index: 5;
    }

    /* 隐藏 vue.css 默认右侧语言标签 */
    .markdown-section pre[data-lang]::after {
      content: none !important;
    }

    /* 复制按钮（右上角，常驻显示） */
    .docsify-copy-code-button {
      position: absolute !important;
      top: 0 !important;
      right: 0 !important;
      opacity: 1 !important;
      z-index: 10 !important;
      background: rgba(255, 255, 255, 0.08) !important;
      color: #94a3b8 !important;
      font-size: 0.72em !important;
      padding: 3px 12px !important;
      border: none !important;
      border-bottom-left-radius: 8px !important;
      border-top-right-radius: 10px !important;
      cursor: pointer !important;
      transition: all 0.2s ease !important;
      font-family: -apple-system, "PingFang SC", sans-serif !important;
    }

    .docsify-copy-code-button:hover {
      background: var(--accent) !important;
      color: #fff !important;
    }

    /* Prism 语法高亮配色 (Material 风格) */
    .token.comment,
    .token.prolog,
    .token.doctype,
    .token.cdata {
      color: #5c6370;
      font-style: italic;
    }
    .token.punctuation {
      color: #89ddff;
    }
    .token.property,
    .token.tag,
    .token.boolean,
    .token.number,
    .token.constant,
    .token.symbol {
      color: #f78c6c;
    }
    .token.selector,
    .token.attr-name,
    .token.string,
    .token.char,
    .token.builtin,
    .token.inserted {
      color: #c3e88d;
    }
    .token.operator,
    .token.entity,
    .token.url,
    .language-css .token.string,
    .style .token.string {
      color: #89ddff;
    }
    .token.atrule,
    .token.attr-value,
    .token.keyword {
      color: #c792ea;
    }
    .token.function,
    .token.class-name {
      color: #82aaff;
    }
    .token.regex,
    .token.important,
    .token.variable {
      color: #d19a66;
    }

    .markdown-section blockquote {
      border-left: 4px solid var(--accent);
      background: var(--blockquote-bg);
      color: var(--blockquote-text);
    }

    .markdown-section table {
      display: table;
      width: 100%;
    }

    .markdown-section table tr:nth-child(even) {
      background: var(--table-even-bg);
    }

    .markdown-section table th {
      background: var(--table-header-bg);
      color: var(--text-heading);
      font-weight: 600;
    }

    .markdown-section table td {
      color: var(--text);
    }

    /* 侧边栏 */
    .sidebar {
      color: var(--sidebar-text);
      background: var(--sidebar-bg);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .sidebar ul li a {
      color: var(--sidebar-text);
    }

    .sidebar ul li.active > a {
      color: var(--accent);
      font-weight: 600;
    }

    .sidebar-nav a.active {
      color: var(--accent);
    }

    .app-name-link {
      color: var(--accent);
      font-weight: 700;
    }

    .search input {
      border-radius: 6px;
      background: var(--search-bg);
      color: var(--text);
      border-color: var(--border);
    }

    .search input:focus {
      border-color: var(--accent);
    }

    .search .matching-post {
      border-radius: 6px;
    }

    .search p {
      color: var(--text);
    }

    .search h3 {
      color: var(--text-heading);
    }

    /* 封面页 */
    .cover.show {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #2c7be5 100%) !important;
    }

    .cover-main {
      text-align: center;
    }

    .cover-main blockquote {
      border: none;
      background: transparent;
      color: rgba(255, 255, 255, 0.85) !important;
    }

    .cover-main li {
      color: rgba(255, 255, 255, 0.9) !important;
    }

    .cover-main h1 {
      color: #fff !important;
    }

    .cover-main a {
      border-radius: 30px;
      padding: 8px 28px;
    }

    /* 翻页 */
    .docsify-pagination-container {
      margin-top: 3em;
    }

    /* Mermaid 图表 */
    .markdown-section .mermaid {
      text-align: center;
      background: var(--mermaid-bg);
      border: 1px solid var(--mermaid-border);
      border-radius: 10px;
      padding: 1.5em 1em;
      margin: 1.5em 0;
      overflow-x: auto;
    }

    .markdown-section .mermaid svg {
      max-width: 100%;
      height: auto;
    }

    .markdown-section .mermaid .node {
      cursor: pointer;
    }

    /* 自定义多模式搜索 */
    .kb-search {
      padding: 10px 15px 6px;
    }

    .kb-search-input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--search-bg);
      color: var(--text);
      font-size: 14px;
      outline: none;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }

    .kb-search-input:focus {
      border-color: var(--accent);
    }

    .kb-search-modes {
      display: flex;
      gap: 4px;
      margin-top: 8px;
    }

    .kb-mode-btn {
      flex: 1;
      padding: 4px 0;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: transparent;
      color: var(--text-muted);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .kb-mode-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .kb-mode-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .kb-search-results {
      margin-top: 8px;
      max-height: 420px;
      overflow-y: auto;
    }

    .kb-result-item {
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 4px;
      transition: background 0.2s;
    }

    .kb-result-item:hover {
      background: var(--bg-secondary);
    }

    .kb-result-title {
      font-weight: 600;
      color: var(--text-heading);
      font-size: 13px;
      margin-bottom: 3px;
    }

    .kb-result-path {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 3px;
    }

    .kb-result-snippet {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .kb-result-snippet mark {
      background: rgba(44, 123, 229, 0.2);
      color: var(--accent);
      border-radius: 2px;
      padding: 0 2px;
      font-weight: 600;
    }

    .kb-search-hint {
      font-size: 12px;
      color: var(--text-muted);
      padding: 12px 10px;
      text-align: center;
    }

    /* 封面页搜索 */
    .kb-cover-search {
      margin-top: 2em;
      max-width: 480px;
      margin-left: auto;
      margin-right: auto;
    }

    .kb-cover-input {
      width: 100%;
      padding: 10px 16px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 15px;
      outline: none;
      box-sizing: border-box;
      backdrop-filter: blur(4px);
      transition: all 0.2s;
    }

    .kb-cover-input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    .kb-cover-input:focus {
      border-color: rgba(255, 255, 255, 0.6);
      background: rgba(255, 255, 255, 0.15);
    }

    .kb-cover-modes {
      display: flex;
      gap: 6px;
      margin-top: 8px;
      justify-content: center;
    }

    .kb-cover-mode-btn {
      padding: 4px 14px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      background: transparent;
      color: rgba(255, 255, 255, 0.7);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .kb-cover-mode-btn:hover {
      border-color: rgba(255, 255, 255, 0.5);
      color: #fff;
    }

    .kb-cover-mode-btn.active {
      background: rgba(255, 255, 255, 0.9);
      color: #1a1a2e;
      border-color: rgba(255, 255, 255, 0.9);
    }

    .kb-cover-results {
      margin-top: 10px;
      max-height: 320px;
      overflow-y: auto;
      text-align: left;
    }

    .kb-cover-results .kb-result-item {
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 6px;
      background: rgba(0, 0, 0, 0.2);
      transition: background 0.2s;
    }

    .kb-cover-results .kb-result-item:hover {
      background: rgba(0, 0, 0, 0.35);
    }

    .kb-cover-results .kb-result-title {
      color: #fff;
      font-size: 14px;
      font-weight: 600;
    }

    .kb-cover-results .kb-result-path {
      color: rgba(255, 255, 255, 0.5);
      font-size: 11px;
    }

    .kb-cover-results .kb-result-snippet {
      color: rgba(255, 255, 255, 0.7);
      font-size: 12px;
    }

    .kb-cover-results .kb-result-snippet mark {
      background: rgba(96, 165, 250, 0.4);
      color: #fff;
    }

    .kb-cover-results .kb-search-hint {
      color: rgba(255, 255, 255, 0.5);
      font-size: 13px;
      padding: 16px;
      text-align: center;
    }

    /* 主题切换按钮 */
    .theme-toggle {
      position: fixed;
      top: 45px;
      right: 45px;
      z-index: 999;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--bg-secondary);
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      box-shadow: 0 2px 8px var(--shadow);
    }

    .theme-toggle:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: scale(1.1) rotate(15deg);
      box-shadow: 0 4px 12px var(--shadow);
    }

    .theme-toggle:active {
      transform: scale(0.95);
    }

    .theme-toggle svg {
      display: block;
      width: 20px;
      height: 20px;
    }

    .theme-toggle .icon-sun { display: none; }
    .theme-toggle .icon-moon { display: flex; }
    [data-theme="dark"] .theme-toggle .icon-sun { display: flex; }
    [data-theme="dark"] .theme-toggle .icon-moon { display: none; }
  </style>
</head>

<body>
  <div id="app">加载中...</div>
  <script src="search.js"></script>
  <script>
    window.$docsify = {
      name: "knowledge-database",
      repo: "caseclose/knowledge-database",
      coverpage: true,
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      copyCode: {
        buttonText: "复制",
        errorText: "复制失败",
        successText: "已复制",
      },
      pagination: {
        previousText: "上一篇",
        nextText: "下一篇",
        crossChapter: true,
      },
      markdown: {
        renderer: {
          code: function (code, lang) {
            if (lang === "mermaid") {
              return '<div class="mermaid">' + code + "</div>";
            }
            return this.origin.code.apply(this, arguments);
          },
        },
      },
      plugins: [
        function (hook) {
          hook.doneEach(function () {
            if (window.mermaid) {
              window.mermaid.init(undefined, ".mermaid:not([data-processed])");
            }
          });
        },
        function (hook) {
          hook.mounted(function () {
            var btn = document.createElement("button");
            btn.className = "theme-toggle";
            btn.title = "切换深色/浅色模式";
            btn.innerHTML =
              '<span class="icon-moon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg></span>' +
              '<span class="icon-sun"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg></span>';
            btn.addEventListener("click", function () {
              var current =
                document.documentElement.getAttribute("data-theme");
              var next = current === "dark" ? "light" : "dark";
              document.documentElement.setAttribute("data-theme", next);
              try { localStorage.setItem("kb-theme", next); } catch (e) {}
            });
            document.body.appendChild(btn);
          });
        },
        kbSearchPlugin,
      ],
    };
  </script>
  <script src="//cdn.jsdelivr.net/npm/mermaid@9/dist/mermaid.min.js"></script>
  <script>
    mermaid.initialize({
      startOnLoad: false,
      theme: "base",
      themeVariables: {
        primaryColor: "#2c7be5",
        primaryTextColor: "#fff",
        primaryBorderColor: "#2c7be5",
        lineColor: "#94a3b8",
        fontSize: "14px",
      },
    });
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/fuse.js@6/dist/fuse.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/emoji.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
</body>

</html>

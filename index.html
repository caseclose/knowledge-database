<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <title>knowledge-database</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify/lib/themes/vue.css" />
  <style>
    :root {
      --theme-color: #2c7be5;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-text-size-adjust: 100%;
      text-rendering: optimizeLegibility;
      color: #2c3e50;
      background: #fff;
    }

    .markdown-section {
      color: #2c3e50;
      max-width: 900px;
    }

    .markdown-section h1,
    .markdown-section h2,
    .markdown-section h3,
    .markdown-section h4 {
      color: #1a202c;
      font-weight: 700;
    }

    .markdown-section a {
      color: #2c7be5;
    }

    /* 行内代码 */
    .markdown-section code {
      font-family: "SF Mono", "JetBrains Mono", "Fira Code", Menlo, Monaco,
        Consolas, monospace;
      background: #f1f5f9;
      color: #e53e3e;
      border-radius: 4px;
      padding: 2px 6px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* 代码块容器 */
    .markdown-section pre {
      background: #1e293b;
      border-radius: 10px;
      padding: 2.2em 0 1.3em;
      margin: 1.6em 0;
      box-shadow: 0 4px 14px rgba(30, 41, 59, 0.12);
      position: relative;
      overflow: hidden;
    }

    .markdown-section pre code {
      background: transparent;
      color: #e2e8f0;
      padding: 0 1.6em;
      font-size: 0.9em;
      line-height: 1.65;
      font-family: "SF Mono", "JetBrains Mono", "Fira Code", Menlo, Monaco,
        Consolas, monospace;
    }

    /* 语言标签徽章（左上角） */
    .markdown-section pre[data-lang]::before {
      content: attr(data-lang);
      position: absolute;
      top: 0;
      left: 0;
      padding: 3px 12px;
      font-size: 0.7em;
      font-family: "SF Mono", "JetBrains Mono", Menlo, monospace;
      color: #64748b;
      background: rgba(0, 0, 0, 0.25);
      border-bottom-right-radius: 8px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      font-weight: 600;
    }

    /* 复制按钮（右上角） */
    .docsify-copy-code-button {
      position: absolute !important;
      top: 0 !important;
      right: 0 !important;
      background: rgba(255, 255, 255, 0.08) !important;
      color: #94a3b8 !important;
      font-size: 0.72em !important;
      padding: 3px 12px !important;
      border: none !important;
      border-bottom-left-radius: 8px !important;
      border-top-right-radius: 10px !important;
      cursor: pointer !important;
      transition: all 0.2s ease !important;
      font-family: -apple-system, "PingFang SC", sans-serif !important;
    }

    .docsify-copy-code-button:hover {
      background: rgba(44, 123, 229, 0.5) !important;
      color: #fff !important;
    }

    /* Prism 语法高亮配色 (Material 风格) */
    .token.comment,
    .token.prolog,
    .token.doctype,
    .token.cdata {
      color: #5c6370;
      font-style: italic;
    }
    .token.punctuation {
      color: #89ddff;
    }
    .token.property,
    .token.tag,
    .token.boolean,
    .token.number,
    .token.constant,
    .token.symbol {
      color: #f78c6c;
    }
    .token.selector,
    .token.attr-name,
    .token.string,
    .token.char,
    .token.builtin,
    .token.inserted {
      color: #c3e88d;
    }
    .token.operator,
    .token.entity,
    .token.url,
    .language-css .token.string,
    .style .token.string {
      color: #89ddff;
    }
    .token.atrule,
    .token.attr-value,
    .token.keyword {
      color: #c792ea;
    }
    .token.function,
    .token.class-name {
      color: #82aaff;
    }
    .token.regex,
    .token.important,
    .token.variable {
      color: #d19a66;
    }

    .markdown-section blockquote {
      border-left: 4px solid #2c7be5;
      background: #f0f7ff;
      color: #4a5568;
    }

    .markdown-section table {
      display: table;
      width: 100%;
    }

    .markdown-section table tr {
      border: none;
    }

    .markdown-section table tr:nth-child(even) {
      background: #f8fafc;
    }

    .markdown-section table th {
      background: #edf2f7;
      color: #1a202c;
      font-weight: 600;
    }

    .sidebar {
      color: #4a5568;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .sidebar ul li a {
      color: #4a5568;
    }

    .sidebar ul li.active > a {
      color: #2c7be5;
      font-weight: 600;
    }

    .sidebar-nav a.active {
      color: #2c7be5;
    }

    .app-name-link {
      color: #2c7be5;
      font-weight: 700;
    }

    .search input {
      border-radius: 6px;
    }

    .search .matching-post {
      border-radius: 6px;
    }

    /* 封面页 */
    .cover.show {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #2c7be5 100%) !important;
    }

    .cover-main {
      text-align: center;
    }

    .cover-main blockquote {
      border: none;
      background: transparent;
      color: rgba(255, 255, 255, 0.85) !important;
    }

    .cover-main li {
      color: rgba(255, 255, 255, 0.9) !important;
    }

    .cover-main h1 {
      color: #fff !important;
    }

    .cover-main a {
      border-radius: 30px;
      padding: 8px 28px;
    }

    .anchor {
      text-decoration: none;
    }

    /* 翻页 */
    .docsify-pagination-container {
      margin-top: 3em;
    }

    /* Mermaid 图表 */
    .markdown-section .mermaid {
      text-align: center;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 1.5em 1em;
      margin: 1.5em 0;
      overflow-x: auto;
    }

    .markdown-section .mermaid svg {
      max-width: 100%;
      height: auto;
    }
  </style>
</head>

<body>
  <div id="app">加载中...</div>
  <script>
    window.$docsify = {
      name: "knowledge-database",
      repo: "caseclose/knowledge-database",
      coverpage: true,
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      search: {
        placeholder: "搜索知识",
        noData: "没有找到结果",
        depth: 3,
        hideOtherSidebarContent: false,
      },
      copyCode: {
        buttonText: "复制",
        errorText: "复制失败",
        successText: "已复制",
      },
      pagination: {
        previousText: "上一篇",
        nextText: "下一篇",
        crossChapter: true,
      },
      themeColor: "#2c7be5",
      markdown: {
        renderer: {
          code: function (code, lang) {
            if (lang === "mermaid") {
              return '<div class="mermaid">' + code + "</div>";
            }
            return this.origin.code.apply(this, arguments);
          },
        },
      },
      plugins: [
        function (hook) {
          hook.doneEach(function () {
            if (window.mermaid) {
              window.mermaid.init(undefined, ".mermaid:not([data-processed])");
            }
          });
        },
      ],
    };
  </script>
  <script src="//cdn.jsdelivr.net/npm/mermaid@9/dist/mermaid.min.js"></script>
  <script>
    mermaid.initialize({
      startOnLoad: false,
      theme: "base",
      themeVariables: {
        primaryColor: "#2c7be5",
        primaryTextColor: "#fff",
        primaryBorderColor: "#2c7be5",
        lineColor: "#94a3b8",
        fontSize: "14px",
      },
    });
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/emoji.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
</body>

</html>

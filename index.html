<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <title>knowledge-database</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify/lib/themes/vue.css" />
  <style>
    :root {
      --theme-color: #2c7be5;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-text-size-adjust: 100%;
      text-rendering: optimizeLegibility;
      color: #2c3e50;
      background: #fff;
    }

    .markdown-section {
      color: #2c3e50;
      max-width: 900px;
    }

    .markdown-section h1,
    .markdown-section h2,
    .markdown-section h3,
    .markdown-section h4 {
      color: #1a202c;
      font-weight: 700;
    }

    .markdown-section a {
      color: #2c7be5;
    }

    .markdown-section code {
      font-family: "SF Mono", "JetBrains Mono", "Fira Code", Menlo, Monaco,
        Consolas, monospace;
      background: #f1f5f9;
      color: #e53e3e;
      border-radius: 4px;
      padding: 2px 6px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .markdown-section pre {
      border-radius: 8px;
    }

    .markdown-section pre code {
      background: #1e293b;
      color: #e2e8f0;
      padding: 0;
    }

    .markdown-section blockquote {
      border-left: 4px solid #2c7be5;
      background: #f0f7ff;
      color: #4a5568;
    }

    .markdown-section table {
      display: table;
      width: 100%;
    }

    .markdown-section table tr {
      border: none;
    }

    .markdown-section table tr:nth-child(even) {
      background: #f8fafc;
    }

    .markdown-section table th {
      background: #edf2f7;
      color: #1a202c;
      font-weight: 600;
    }

    .sidebar {
      color: #4a5568;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .sidebar ul li a {
      color: #4a5568;
    }

    .sidebar ul li.active > a {
      color: #2c7be5;
      font-weight: 600;
    }

    .sidebar-nav a.active {
      color: #2c7be5;
    }

    .app-name-link {
      color: #2c7be5;
      font-weight: 700;
    }

    .search input {
      border-radius: 6px;
    }

    .search .matching-post {
      border-radius: 6px;
    }

    /* 封面页 */
    .cover.show {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #2c7be5 100%) !important;
    }

    .cover-main {
      text-align: center;
    }

    .cover-main blockquote {
      border: none;
      background: transparent;
      color: rgba(255, 255, 255, 0.85) !important;
    }

    .cover-main li {
      color: rgba(255, 255, 255, 0.9) !important;
    }

    .cover-main h1 {
      color: #fff !important;
    }

    .cover-main a {
      border-radius: 30px;
      padding: 8px 28px;
    }

    .anchor {
      text-decoration: none;
    }

    /* 翻页 */
    .docsify-pagination-container {
      margin-top: 3em;
    }
  </style>
</head>

<body>
  <div id="app">加载中...</div>
  <script>
    window.$docsify = {
      name: "knowledge-database",
      repo: "caseclose/knowledge-database",
      coverpage: true,
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      search: {
        placeholder: "搜索知识",
        noData: "没有找到结果",
        depth: 3,
        hideOtherSidebarContent: false,
      },
      copyCode: {
        buttonText: "复制",
        errorText: "复制失败",
        successText: "已复制",
      },
      pagination: {
        previousText: "上一篇",
        nextText: "下一篇",
        crossChapter: true,
      },
      themeColor: "#2c7be5",
    };
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/emoji.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
</body>

</html>

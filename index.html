<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <title>knowledge-database</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="vue.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css" />
  <script>
    (function () {
      var saved;
      try { saved = localStorage.getItem("kb-theme"); } catch (e) {}
      var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      var theme = saved || (prefersDark ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
      try {
        var w = parseInt(localStorage.getItem("kb-sidebar-width"), 10);
        if (w >= 240 && w <= 800) {
          document.documentElement.style.setProperty("--sidebar-width", w + "px");
        }
        var h = localStorage.getItem("kb-search-height");
        if (h && /^\d+px$/.test(h)) {
          document.documentElement.style.setProperty("--kb-search-height", h);
        } else if (h && /^\d+$/.test(h)) {
          document.documentElement.style.setProperty("--kb-search-height", h + "px");
        }
        var collapsedPref = localStorage.getItem("kb-sidebar-collapsed");
        var hash = location.hash || "#/";
        var isHome = hash === "#" || hash === "#/" || hash === "#/README" || hash.indexOf("#/README?") === 0;
        if (isHome || collapsedPref !== "0") {
          document.documentElement.setAttribute("data-sidebar-collapsed", "1");
        }
      } catch (e) {
        document.documentElement.setAttribute("data-sidebar-collapsed", "1");
      }
    })();
  </script>
  <style>
    :root {
      --theme-color: #2c7be5;
      --accent: #2c7be5;
      --bg: #ffffff;
      --bg-secondary: #f8fafc;
      --text: #2c3e50;
      --text-heading: #1a202c;
      --text-muted: #4a5568;
      --border: #e2e8f0;
      --code-bg: #1e293b;
      --code-text: #e2e8f0;
      --inline-code-bg: #f1f5f9;
      --inline-code-text: #e53e3e;
      --table-header-bg: #edf2f7;
      --table-even-bg: #f8fafc;
      --blockquote-bg: #f0f7ff;
      --blockquote-text: #4a5568;
      --sidebar-bg: #ffffff;
      --sidebar-text: #4a5568;
      --search-bg: #f1f5f9;
      --mermaid-bg: #f8fafc;
      --mermaid-border: #e2e8f0;
      --shadow: rgba(30, 41, 59, 0.12);
      --sidebar-width: 328px;
      --kb-search-height: 46%;
      --radius: 12px;
      --radius-sm: 8px;
      color-scheme: light;
    }

    [data-theme="dark"] {
      --theme-color: #60a5fa;
      --accent: #60a5fa;
      --bg: #0f172a;
      --bg-secondary: #1e293b;
      --text: #cbd5e1;
      --text-heading: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #334155;
      --code-bg: #0d1117;
      --code-text: #e2e8f0;
      --inline-code-bg: #1e293b;
      --inline-code-text: #f87171;
      --table-header-bg: #1e293b;
      --table-even-bg: #0f172a;
      --blockquote-bg: #1e293b;
      --blockquote-text: #94a3b8;
      --sidebar-bg: #0f172a;
      --sidebar-text: #94a3b8;
      --search-bg: #1e293b;
      --mermaid-bg: #1e293b;
      --mermaid-border: #334155;
      --shadow: rgba(0, 0, 0, 0.3);
      color-scheme: dark;
    }

    ::selection {
      background: color-mix(in srgb, var(--accent) 28%, transparent);
      color: var(--text-heading);
    }

    /* 代码块是深色底：全局选中色会把字改成深色标题色，白天模式几乎看不清 */
    .markdown-section pre::selection,
    .markdown-section pre *::selection {
      background: color-mix(in srgb, #93c5fd 62%, transparent);
      color: #f8fafc;
    }

    .markdown-section pre::-moz-selection,
    .markdown-section pre *::-moz-selection {
      background: color-mix(in srgb, #93c5fd 62%, transparent);
      color: #f8fafc;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-text-size-adjust: 100%;
      text-rendering: optimizeLegibility;
      color: var(--text);
      background: var(--bg);
    }

    .markdown-section {
      color: var(--text);
      max-width: 900px;
      font-size: 16.5px;
      line-height: 1.8;
    }

    .markdown-section a {
      color: var(--accent);
    }

    .markdown-section p {
      color: var(--text);
    }

    .markdown-section h1 {
      letter-spacing: -0.03em;
      line-height: 1.25;
    }

    .markdown-section h2 {
      font-size: 1.42rem;
      margin: 2.1em 0 0.7rem;
      padding-bottom: 0.38em;
      border-bottom: 1px solid var(--border);
      letter-spacing: -0.02em;
    }

    .markdown-section h3 {
      font-size: 1.18rem;
      margin: 1.7em 0 0.5rem;
    }

    /* 行内代码 */
    .markdown-section code {
      font-family: "SF Mono", "JetBrains Mono", "Fira Code", Menlo, Monaco,
        Consolas, monospace;
      background: var(--inline-code-bg);
      color: var(--inline-code-text);
      border-radius: 4px;
      padding: 2px 6px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* 代码块容器 */
    .markdown-section pre {
      background: var(--code-bg);
      border-radius: 10px;
      padding: 2.2em 0 1.3em;
      margin: 1.6em 0;
      box-shadow: 0 4px 14px var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .markdown-section pre code {
      background: transparent;
      color: var(--code-text);
      padding: 0 1.6em;
      font-size: 0.9em;
      line-height: 1.65;
      font-family: "SF Mono", "JetBrains Mono", "Fira Code", Menlo, Monaco,
        Consolas, monospace;
    }

    /* 语言标签徽章（左上角） */
    .markdown-section pre[data-lang]::before {
      content: attr(data-lang);
      position: absolute;
      top: 0;
      left: 0;
      padding: 3px 12px;
      font-size: 0.7em;
      font-family: "SF Mono", "JetBrains Mono", Menlo, monospace;
      color: #64748b;
      background: rgba(0, 0, 0, 0.25);
      border-bottom-right-radius: 8px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      font-weight: 600;
      z-index: 5;
    }

    /* 隐藏 vue.css 默认右侧语言标签 */
    .markdown-section pre[data-lang]::after {
      content: none !important;
    }

    /* 复制按钮（右上角，常驻显示） */
    .docsify-copy-code-button {
      position: absolute !important;
      top: 0 !important;
      right: 0 !important;
      opacity: 1 !important;
      z-index: 10 !important;
      background: rgba(255, 255, 255, 0.08) !important;
      color: #94a3b8 !important;
      font-size: 0.72em !important;
      padding: 3px 12px !important;
      border: none !important;
      border-bottom-left-radius: 8px !important;
      border-top-right-radius: 10px !important;
      cursor: pointer !important;
      transition: all 0.2s ease !important;
      font-family: -apple-system, "PingFang SC", sans-serif !important;
    }

    .docsify-copy-code-button:hover {
      background: var(--accent) !important;
      color: #fff !important;
    }

    /* Prism 语法高亮配色 (Material 风格) */
    .token.comment,
    .token.prolog,
    .token.doctype,
    .token.cdata {
      color: #5c6370;
      font-style: italic;
    }
    .token.punctuation {
      color: #89ddff;
    }
    .token.property,
    .token.tag,
    .token.boolean,
    .token.number,
    .token.constant,
    .token.symbol {
      color: #f78c6c;
    }
    .token.selector,
    .token.attr-name,
    .token.string,
    .token.char,
    .token.builtin,
    .token.inserted {
      color: #c3e88d;
    }
    .token.operator,
    .token.entity,
    .token.url,
    .language-css .token.string,
    .style .token.string {
      color: #89ddff;
    }
    .token.atrule,
    .token.attr-value,
    .token.keyword {
      color: #c792ea;
    }
    .token.function,
    .token.class-name {
      color: #82aaff;
    }
    .token.regex,
    .token.important,
    .token.variable {
      color: #d19a66;
    }

    .markdown-section blockquote {
      border-left: 4px solid var(--accent);
      background: var(--blockquote-bg);
      color: var(--blockquote-text);
      border-radius: 0 10px 10px 0;
    }

    .markdown-section blockquote.kb-takeaway {
      border-left-color: #d97706;
      background: color-mix(in srgb, #d97706 9%, var(--bg));
      color: var(--text);
      padding: 12px 16px;
      box-shadow: 0 1px 4px var(--shadow);
    }

    [data-theme="dark"] .markdown-section blockquote.kb-takeaway {
      border-left-color: #fbbf24;
      background: color-mix(in srgb, #fbbf24 10%, var(--bg));
    }

    .markdown-section blockquote.kb-takeaway p {
      margin: 0;
    }

    .kb-article-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 12px;
      margin: 0 0 1.6em;
      padding: 10px 14px;
      background: var(--blockquote-bg);
      border-left: 4px solid var(--accent);
      border-radius: 0 10px 10px 0;
      color: var(--blockquote-text);
      font-size: 13px;
    }

    .kb-article-meta .kb-meta-item {
      font-size: 13px;
    }

    .kb-tag-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 2px;
    }

    .kb-tag-filter {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--bg);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .kb-tag-filter:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .kb-tag-filter.is-active {
      background: color-mix(in srgb, var(--accent) 12%, var(--bg));
      border-color: color-mix(in srgb, var(--accent) 40%, var(--border));
      color: var(--accent);
    }

    .kb-tag-count {
      font-size: 10px;
      font-weight: 700;
      opacity: 0.75;
    }

    .kb-result-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin: 0 0 6px;
    }

    .kb-tag {
      display: inline-flex;
      align-items: center;
      padding: 1px 7px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.02em;
      background: color-mix(in srgb, #d97706 14%, var(--bg));
      color: #b45309;
      border: 1px solid color-mix(in srgb, #d97706 30%, var(--border));
      cursor: pointer;
    }

    [data-theme="dark"] .kb-tag {
      background: color-mix(in srgb, #fbbf24 16%, transparent);
      color: #fbbf24;
      border-color: color-mix(in srgb, #fbbf24 28%, var(--border));
    }

    .kb-article-meta .kb-tag {
      font-size: 12px;
      padding: 2px 9px;
    }

    .markdown-section table {
      display: table;
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 10px;
      margin: 1.4em 0;
      font-size: 0.95em;
    }

    .markdown-section table tr:nth-child(even) {
      background: var(--table-even-bg);
    }

    .markdown-section table th,
    .markdown-section table td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
    }

    .markdown-section table th {
      background: var(--table-header-bg);
      color: var(--text-heading);
      font-weight: 650;
      text-align: left;
    }

    .markdown-section table td {
      color: var(--text);
    }

    .markdown-section table tr:last-child td {
      border-bottom: 0;
    }

    /* 侧边栏 */
    .sidebar {
      display: flex;
      flex-direction: column;
      position: fixed;
      width: var(--sidebar-width) !important;
      color: var(--sidebar-text);
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      padding: 0 !important;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .sidebar > h1.app-name {
      display: none;
    }

    .content {
      left: var(--sidebar-width) !important;
    }

    .kb-search {
      flex: 0 0 var(--kb-search-height);
      height: var(--kb-search-height);
      min-height: 160px;
      max-height: calc(100% - 152px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 12px 0 8px;
      background:
        linear-gradient(180deg, color-mix(in srgb, var(--accent) 6%, var(--sidebar-bg)) 0%, var(--sidebar-bg) 72px);
    }

    .kb-search-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 12px 10px;
      color: inherit;
      text-decoration: none;
    }

    .kb-search-brand:hover .kb-brand-name {
      color: var(--accent);
    }

    .kb-search-brand:focus-visible {
      outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent);
      outline-offset: 3px;
      border-radius: 8px;
    }

    .kb-brand-logo {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      flex-shrink: 0;
      box-shadow: 0 1px 3px var(--shadow);
    }

    .kb-brand-name {
      color: var(--text-heading);
      font-size: 13px;
      font-weight: 750;
      letter-spacing: -0.03em;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .kb-search-box {
      position: relative;
      display: block;
      margin: 0 12px;
    }

    .kb-search-icon {
      position: absolute;
      left: 11px;
      top: 50%;
      width: 15px;
      height: 15px;
      color: var(--text-muted);
      transform: translateY(-50%);
      pointer-events: none;
    }

    .kb-search-input {
      width: 100%;
      padding: 8px 34px 8px 34px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--search-bg);
      color: var(--text);
      font-size: 13px;
      line-height: 1.4;
      outline: none;
      box-sizing: border-box;
      transition: border-color 0.18s, box-shadow 0.18s, background 0.18s;
    }

    .kb-search-input::placeholder {
      color: var(--text-muted);
    }

    .kb-search-input:focus {
      border-color: var(--accent);
      background: var(--bg);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent);
    }

    .kb-search-kbd {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      min-width: 18px;
      padding: 0 5px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: var(--bg);
      color: var(--text-muted);
      font-size: 11px;
      font-family: inherit;
      line-height: 18px;
      text-align: center;
      pointer-events: none;
    }

    .kb-search-clear {
      position: absolute;
      right: 5px;
      top: 50%;
      transform: translateY(-50%);
      width: 22px;
      height: 22px;
      padding: 0;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--text-muted);
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
    }

    .kb-search-clear:hover {
      background: var(--bg-secondary);
      color: var(--text-heading);
    }

    .kb-search-box.is-active .kb-search-kbd,
    .kb-cover-box.is-active .kb-search-kbd,
    .kb-search-clear[hidden] {
      display: none;
    }

    .kb-meta-item.is-recent {
      color: var(--accent);
      font-weight: 650;
    }

    .kb-search-toolbar {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin: 8px 12px 0;
    }

    .kb-seg {
      display: flex;
      gap: 2px;
      padding: 3px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg-secondary);
    }

    .kb-mode-btn,
    .kb-sort-btn,
    .kb-sort-order {
      flex: 1;
      padding: 5px 0;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 550;
      line-height: 1.2;
      cursor: pointer;
      transition: color 0.15s, background 0.15s, box-shadow 0.15s;
      white-space: nowrap;
    }

    .kb-mode-btn:hover,
    .kb-sort-btn:hover,
    .kb-sort-order:hover {
      color: var(--text-heading);
    }

    .kb-mode-btn.active,
    .kb-sort-btn.active {
      background: var(--bg);
      color: var(--accent);
      font-weight: 700;
      box-shadow: 0 1px 2px var(--shadow);
    }

    .kb-sort-order {
      flex: 0 0 auto;
      padding: 5px 8px;
      color: var(--text-heading);
    }

    .kb-search.is-searching .kb-catalog-bar {
      opacity: 0.45;
      pointer-events: none;
    }

    .kb-search-results {
      flex: 1;
      min-height: 0;
      margin-top: 6px;
      overflow-y: auto;
      padding: 0 2px 4px 12px;
    }

    .kb-search-results::-webkit-scrollbar,
    .kb-nav-panel .sidebar-nav::-webkit-scrollbar {
      width: 8px;
    }

    .kb-search-results::-webkit-scrollbar-thumb,
    .kb-nav-panel .sidebar-nav::-webkit-scrollbar-thumb {
      background: color-mix(in srgb, var(--text-muted) 35%, transparent);
      border-radius: 99px;
    }

    .kb-catalog-count {
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.02em;
      padding: 2px 4px 6px;
    }

    .kb-catalog-count strong {
      color: var(--text-heading);
      font-weight: 700;
    }

    .kb-result-item {
      display: block;
      width: 100%;
      appearance: none;
      -webkit-appearance: none;
      text-align: left;
      padding: 9px 10px;
      border: 1px solid color-mix(in srgb, var(--border) 80%, transparent);
      border-radius: 10px;
      background: color-mix(in srgb, var(--bg-secondary) 70%, var(--sidebar-bg));
      color: inherit;
      cursor: pointer;
      margin-bottom: 6px;
      font: inherit;
      transition: background 0.15s, border-color 0.15s, box-shadow 0.15s;
    }

    .kb-result-item:hover {
      background: var(--bg-secondary);
      border-color: var(--border);
      box-shadow: 0 1px 4px var(--shadow);
    }

    .kb-result-item:focus-visible {
      outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent);
      outline-offset: 1px;
    }

    .kb-result-item.is-active {
      background: color-mix(in srgb, var(--accent) 10%, transparent);
      border-color: color-mix(in srgb, var(--accent) 28%, transparent);
      box-shadow: inset 3px 0 0 var(--accent);
    }

    .kb-result-title {
      font-weight: 650;
      color: var(--text-heading);
      font-size: 13.5px;
      line-height: 1.4;
      margin-bottom: 6px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .kb-result-path {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px;
      margin-bottom: 6px;
    }

    .kb-crumb {
      max-width: 9.2em;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 10.5px;
      line-height: 1.4;
      padding: 1px 6px;
      border-radius: 999px;
      background: var(--bg-secondary);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    .kb-result-item.is-active .kb-crumb {
      background: color-mix(in srgb, var(--accent) 8%, var(--bg));
      border-color: color-mix(in srgb, var(--accent) 22%, var(--border));
    }

    .kb-crumb-sep {
      font-size: 10px;
      color: var(--border);
    }

    .kb-result-snippet {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .kb-result-snippet mark {
      background: color-mix(in srgb, var(--accent) 18%, transparent);
      color: var(--accent);
      border-radius: 3px;
      padding: 0 2px;
      font-weight: 650;
    }

    .kb-result-dates {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .kb-meta-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .kb-meta-icon {
      width: 12px;
      height: 12px;
      flex-shrink: 0;
      opacity: 0.75;
    }

    .kb-search-hint {
      font-size: 12px;
      color: var(--text-muted);
      padding: 28px 10px;
      text-align: center;
    }

    .kb-nav-panel {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--sidebar-bg);
    }

    .kb-split-y {
      flex: 0 0 12px;
      position: relative;
      z-index: 24;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: row-resize;
      touch-action: none;
      user-select: none;
    }

    .kb-split-y:focus {
      outline: none;
    }

    .kb-split-y:focus-visible {
      outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent);
      outline-offset: -2px;
    }

    .kb-split-y::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 5px;
      height: 1px;
      background: var(--border);
    }

    .kb-split-y::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 44px;
      height: 5px;
      border-radius: 99px;
      background: color-mix(in srgb, var(--text-muted) 70%, var(--border));
      transform: translate(-50%, -50%);
    }

    .kb-split-y:hover::before,
    .kb-split-y:hover::after,
    .kb-split-y:focus-visible::after,
    .kb-split-y.is-dragging::before,
    .kb-split-y.is-dragging::after {
      background: var(--accent);
    }

    .kb-split-x {
      position: fixed;
      top: 0;
      /* 贴在侧栏外缘，不要盖住侧栏内部的滚动条 */
      left: var(--sidebar-width);
      width: 12px;
      height: 100%;
      z-index: 22;
      cursor: col-resize;
      touch-action: none;
      background: transparent;
      user-select: none;
      transition: left 0.25s ease;
    }

    .kb-split-x:focus {
      outline: none;
    }

    .kb-split-x:focus-visible {
      outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent);
      outline-offset: -2px;
    }

    .kb-split-x::after {
      content: "";
      position: absolute;
      top: 18%;
      bottom: 18%;
      left: 0;
      width: 3px;
      border-radius: 99px;
      background: color-mix(in srgb, var(--text-muted) 45%, transparent);
    }

    .kb-split-x:hover::after,
    .kb-split-x:focus-visible::after,
    .kb-split-x.is-dragging::after {
      background: var(--accent);
    }

    body.kb-resizing-x {
      cursor: col-resize;
      user-select: none;
    }

    body.kb-resizing-y {
      cursor: row-resize;
      user-select: none;
    }

    body.kb-resizing-x .sidebar,
    body.kb-resizing-x .content,
    body.kb-resizing-x .sidebar-collapse-toggle,
    body.kb-resizing-x .kb-split-x,
    body.kb-resizing-y .sidebar {

    /* 侧边栏收起/展开 */
    .sidebar,
    .content {
      transition: transform 0.25s ease, margin-left 0.25s ease, left 0.25s ease;
    }

    html[data-sidebar-collapsed="1"] .sidebar,
    body.sidebar-collapsed .sidebar {
      transform: translateX(-100%);
    }

    html[data-sidebar-collapsed="1"] .content,
    body.sidebar-collapsed .content {
      left: 0 !important;
      margin-left: 0 !important;
      width: 100% !important;
    }

    html[data-sidebar-collapsed="1"] .markdown-section,
    body.sidebar-collapsed .markdown-section {
      margin-left: auto;
      margin-right: auto;
    }

    .sidebar-collapse-toggle {
      position: fixed;
      top: 50%;
      left: var(--sidebar-width);
      z-index: 23;
      width: 22px;
      height: 56px;
      padding: 0;
      border: 1px solid var(--border);
      border-left: 0;
      border-radius: 0 10px 10px 0;
      background: var(--bg);
      color: var(--text-muted);
      cursor: pointer;
      box-shadow: 2px 0 10px var(--shadow);
      transform: translateY(-50%);
      transition: left 0.25s ease, background 0.15s, color 0.15s;
    }

    .sidebar-collapse-toggle:hover {
      background: var(--accent);
      color: #fff;
    }

    html[data-sidebar-collapsed="1"] .sidebar-collapse-toggle,
    body.sidebar-collapsed .sidebar-collapse-toggle {
      left: 0;
      border-left: 1px solid var(--border);
      border-radius: 0 10px 10px 0;
    }

    html[data-sidebar-collapsed="1"] .kb-split-x,
    body.sidebar-collapsed .kb-split-x {
      display: none;
    }

    /* 封面在视口内时隐藏收起/展开按钮（由 JS 按滚动位置切换 class） */
    body.kb-cover-visible .sidebar-collapse-toggle,
    body.kb-cover-visible .kb-split-x {
      display: none;
    }

    /* 桌面端只用右侧折叠钮；手机端始终显示左下角菜单（含侧栏收起时） */
    @media screen and (min-width: 769px) {
      .sidebar-toggle {
        display: none !important;
      }
    }

    .kb-sidebar-dim {
      display: none;
    }

    @media screen and (max-width: 768px) {
      .content,
      body.close .content,
      html:not([data-sidebar-collapsed="1"]) .content,
      body:not(.sidebar-collapsed) .content {
        left: 0 !important;
        right: 0 !important;
        margin-left: 0 !important;
        width: 100% !important;
        max-width: 100% !important;
        transform: none !important;
      }

      .sidebar {
        left: 0 !important;
        right: 0 !important;
        width: 100% !important;
        max-width: none !important;
        transform: translateX(-100%) !important;
      }

      html[data-sidebar-collapsed="1"] .sidebar,
      body.sidebar-collapsed .sidebar {
        transform: translateX(-100%) !important;
      }

      html:not([data-sidebar-collapsed="1"]) body:not(.sidebar-collapsed) .sidebar,
      body:not(.sidebar-collapsed) .sidebar {
        transform: none !important;
      }

      .sidebar-collapse-toggle {
        display: none;
      }

      .kb-split-x,
      .kb-split-y {
        display: none !important;
      }

      :root,
      html {
        --sidebar-width: 100vw !important;
      }

      html body .sidebar {
        position: fixed !important;
        top: 0 !important;
        bottom: 0 !important;
        height: auto !important;
        max-height: none !important;
        z-index: 80 !important;
        pointer-events: auto;
      }

      .kb-search {
        flex: 0 1 auto;
        height: auto !important;
        min-height: 0;
        max-height: min(36vh, 280px) !important;
      }

      .kb-search:not(.is-searching) .kb-search-results,
      .kb-search:not(.is-searching) .kb-catalog-bar {
        display: none;
      }

      .kb-search.is-searching {
        flex: 0 1 auto;
        max-height: min(48vh, 360px) !important;
      }

      .kb-nav-panel {
        flex: 1 1 0%;
        min-height: 0;
      }

      .sidebar-nav {
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
        padding-bottom: max(96px, calc(56px + env(safe-area-inset-bottom))) !important;
      }

      .kb-search-kbd,
      .sidebar-pin {
        display: none !important;
      }

      html[data-sidebar-collapsed="1"] .sidebar-toggle,
      body.sidebar-collapsed .sidebar-toggle,
      body.close .sidebar-toggle,
      .sidebar-toggle {
        display: block !important;
        position: fixed;
        left: max(14px, env(safe-area-inset-left));
        bottom: max(18px, env(safe-area-inset-bottom));
        width: 48px !important;
        height: 48px !important;
        max-width: 48px !important;
        padding: 13px 12px !important;
        border-radius: 14px;
        background: var(--bg) !important;
        box-shadow: 0 8px 24px var(--shadow);
        z-index: 90 !important;
      }

      .sidebar-toggle span {
        background-color: var(--accent);
        width: 18px;
        height: 2px;
        margin: 0 auto 4px;
        border-radius: 2px;
      }

      .sidebar-toggle span:last-child {
        margin-bottom: 0;
      }

      .kb-sidebar-dim {
        display: none !important;
        pointer-events: none !important;
      }

      html:not([data-sidebar-collapsed="1"]) .kb-sidebar-dim,
      body:not(.sidebar-collapsed) .kb-sidebar-dim {
        display: none !important;
        pointer-events: none !important;
      }
    }

    .kb-cover-results .kb-result-snippet mark {
      background: rgba(96, 165, 250, 0.4);
      color: #fff;
    }

    .kb-cover-results .kb-search-hint {
      color: rgba(255, 255, 255, 0.5);
      font-size: 13px;
      padding: 16px;
      text-align: center;
    }

    /* GitHub 角标：缩小并让出主题按钮位置 */
    .github-corner {
      z-index: 40;
    }

    .github-corner svg {
      width: 64px;
      height: 64px;
      color: var(--bg);
      fill: var(--accent);
    }

    body.kb-cover-visible .github-corner svg {
      color: #0b1224;
      fill: rgba(255, 255, 255, 0.92);
    }

    /* 主题切换按钮 */
    .theme-toggle {
      position: fixed;
      top: 12px;
      right: 72px;
      z-index: 999;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--bg-secondary);
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s ease, color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      box-shadow: 0 2px 8px var(--shadow);
    }

    .theme-toggle:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: scale(1.08) rotate(12deg);
      box-shadow: 0 4px 12px var(--shadow);
    }

    .theme-toggle:active {
      transform: scale(0.95);
    }

    .theme-toggle:focus-visible {
      outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent);
      outline-offset: 2px;
    }

    body.kb-cover-visible .theme-toggle {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.28);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.22);
    }

    body.kb-cover-visible .theme-toggle:hover {
      background: rgba(255, 255, 255, 0.22);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.5);
    }

    @media screen and (max-width: 768px) {
      .github-corner {
        display: none;
      }

      .theme-toggle {
        top: 12px;
        right: 14px;
        width: 38px;
        height: 38px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .theme-toggle,
      .theme-toggle:hover,
      section.cover .cover-main > p:last-child a,
      .docsify-pagination-container .pagination-item a {
        transition: none;
        transform: none;
      }
    }

    .theme-toggle svg {
      display: block;
      width: 20px;
      height: 20px;
    }

    .theme-toggle .icon-sun { display: none; }
    .theme-toggle .icon-moon { display: flex; }
    [data-theme="dark"] .theme-toggle .icon-sun { display: flex; }
    [data-theme="dark"] .theme-toggle .icon-moon { display: none; }

    /* KaTeX 公式 */
    .markdown-section .katex {
      font-size: 1.06em;
      color: var(--text-heading);
    }

    .markdown-section .katex-display {
      margin: 1.25em 0;
      padding: 1em 1.15em;
      overflow-x: auto;
      overflow-y: hidden;
      background: var(--blockquote-bg);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: 10px;
    }

    .markdown-section .katex-display > .katex {
      font-size: 1.12em;
    }

    .markdown-section pre.kb-math-fallback {
      margin: 1.25em 0;
      padding: 1em 1.15em;
      overflow-x: auto;
      background: var(--blockquote-bg);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: 10px;
      white-space: pre-wrap;
      font-size: 0.95em;
    }

    .markdown-section code.kb-math-fallback {
      font-size: 0.92em;
      white-space: normal;
    }

    @media screen and (max-width: 768px) {
      html,
      body {
        overflow-x: hidden;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }

      html:not([data-sidebar-collapsed="1"]),
      html:not([data-sidebar-collapsed="1"]) body {
        overflow: hidden;
      }

      .content {
        padding-top: 8px;
        padding-bottom: max(88px, calc(24px + env(safe-area-inset-bottom)));
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }

      .markdown-section {
        max-width: 100%;
        padding: 16px 16px 32px;
        font-size: 16px;
        line-height: 1.75;
        overflow-wrap: break-word;
        word-break: break-word;
      }

      .markdown-section img {
        max-width: 100%;
        height: auto;
      }

      .markdown-section a,
      .markdown-section code {
        overflow-wrap: anywhere;
      }

      .docsify-copy-code-button {
        padding: 6px 12px !important;
        font-size: 0.78em !important;
      }

      .markdown-section h1 {
        font-size: 1.5rem;
        margin: 0.4em 0 0.7em;
      }

      .markdown-section h2 {
        font-size: 1.2rem;
        margin: 1.55em 0 0.55rem;
      }

      .markdown-section h3 {
        font-size: 1.06rem;
        margin: 1.35em 0 0.4rem;
      }

      .markdown-section pre {
        margin: 1.2em 0;
        border-radius: 8px;
        padding: 2em 0 1em;
      }

      .markdown-section pre code {
        padding: 0 1em;
        font-size: 0.82em;
      }

      .markdown-section table {
        display: block;
        width: 100%;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        font-size: 0.9em;
      }

      .kb-article-meta {
        gap: 6px 10px;
        font-size: 12px;
      }

      .docsify-pagination-container {
        flex-direction: column;
        gap: 10px;
        margin-top: 2.2em;
      }

      .docsify-pagination-container .pagination-item {
        max-width: 100%;
      }

      .docsify-pagination-container .pagination-item--next {
        text-align: left;
      }

      .markdown-section .mermaid {
        padding: 1em 0.6em;
        margin: 1.1em 0;
      }

      .kb-search-kbd,
      .kb-cover-box .kb-search-kbd {
        display: none;
      }

      .cover-main {
        padding: max(52px, calc(16px + env(safe-area-inset-top))) 18px 28px;
      }

      .cover-main > p:first-child img,
      .cover-main h1 img,
      .cover-main img[alt="logo"] {
        width: 64px;
        height: 64px;
        border-radius: 16px;
      }

      .cover-main h1,
      .cover-main h1 a,
      .cover-main h1 span,
      section.cover h1,
      section.cover h1 a,
      section.cover h1 span {
        font-size: 1.7rem !important;
        margin: 0.25rem 0 0.85rem !important;
      }

      .cover-main blockquote {
        font-size: 0.98rem;
        padding: 0 4px;
      }

      .cover-main ul {
        padding-left: 1.1em;
        text-align: left;
        display: inline-block;
        margin: 0 auto 0.6em;
      }

      .cover-main li {
        font-size: 0.95rem;
        line-height: 1.55;
      }

      section.cover .cover-main > p:last-child a {
        display: inline-block;
        min-width: 180px;
        padding: 12px 28px;
        font-size: 15px;
      }

      .kb-cover-search {
        margin-top: 1.2em;
        padding: 0 2px;
      }

      .kb-cover-input {
        font-size: 16px;
        padding: 12px 40px 12px 40px;
      }

      .kb-cover-modes {
        flex-wrap: wrap;
        gap: 8px;
      }

      .kb-cover-mode-btn {
        padding: 7px 14px;
        font-size: 13px;
      }

      .kb-cover-results {
        max-height: min(42vh, 280px);
      }

      .sidebar {
        padding-top: env(safe-area-inset-top) !important;
        box-shadow: 8px 0 32px rgba(15, 23, 42, 0.28);
      }

      .kb-search-input {
        font-size: 16px;
      }

      .kb-mode-btn,
      .kb-sort-btn,
      .kb-sort-order,
      .sidebar-tool,
      .sidebar-nav li > a,
      .sidebar-nav .kb-folder-label,
      .sidebar-nav li > p {
        min-height: 36px;
      }

      .theme-toggle {
        top: max(10px, env(safe-area-inset-top));
        right: max(12px, env(safe-area-inset-right));
        width: 44px;
        height: 44px;
      }

      html:not([data-sidebar-collapsed="1"]) .theme-toggle,
      body:not(.sidebar-collapsed) .theme-toggle {
        visibility: hidden;
        pointer-events: none;
      }

      .sidebar-toggle {
        border: 1px solid var(--border);
        -webkit-tap-highlight-color: transparent;
      }

      .sidebar-toggle span {
        transition: transform 0.2s ease, opacity 0.2s ease;
      }

      html:not([data-sidebar-collapsed="1"]) .sidebar-toggle span:nth-child(1) {
        transform: translateY(6px) rotate(45deg);
      }

      html:not([data-sidebar-collapsed="1"]) .sidebar-toggle span:nth-child(2) {
        opacity: 0;
      }

      html:not([data-sidebar-collapsed="1"]) .sidebar-toggle span:nth-child(3) {
        transform: translateY(-6px) rotate(-45deg);
      }
    }
  </style>
</head>

<body>
  <div id="app">加载中...</div>
  <script src="search.js"></script>
  <script src="katex.js"></script>
  <script>
    window.$docsify = {
      name: "knowledge-database",
      repo: "caseclose/knowledge-database",
      coverpage: true,
      loadSidebar: true,
      subMaxLevel: 3,
      // 默认只展开当前目录，点击目录标题可展开或折叠子目录。
      sidebarDisplayLevel: 1,
      auto2top: true,
      copyCode: {
        buttonText: "复制",
        errorText: "复制失败",
        successText: "已复制",
      },
      pagination: {
        previousText: "上一篇",
        nextText: "下一篇",
        crossChapter: true,
      },
      markdown: {
        renderer: {
          code: function (code, lang) {
            if (lang === "mermaid") {
              return '<div class="mermaid">' + code + "</div>";
            }
            if ((lang === "math" || lang === "tex" || lang === "latex") && window.katex) {
              try {
                return (
                  '<div class="kb-math">' +
                  window.katex.renderToString(code, {
                    displayMode: true,
                    throwOnError: false,
                    output: "html",
                  }) +
                  "</div>"
                );
              } catch (e) {}
            }
            return this.origin.code.apply(this, arguments);
          },
        },
      },
      plugins: [
        function (hook) {
          // 半角 ~ 在中文里常表示区间；marked 会把 1/4~1/8 … 6~8 收成删除线。
          hook.beforeEach(function (content) {
            return content.replace(
              /(\d+(?:\/\d+)?(?:\.\d+)?)\s*~\s*(\d+(?:\/\d+)?(?:\.\d+)?)/g,
              "$1 到 $2"
            );
          });
        },
        function (hook) {
          hook.doneEach(function () {
            document.querySelectorAll(".markdown-section blockquote").forEach(function (quote) {
              var text = (quote.textContent || "").replace(/^\s+/, "");
              if (/^一句话[：:]/.test(text)) quote.classList.add("kb-takeaway");
            });
            if (window.kbRenderMermaid) window.kbRenderMermaid();
          });
        },
        function (hook) {
          // 封面在首页路由下始终留在 DOM 中（下拉只是滚过它），所以按滚动位置判断封面是否真的在视口内：
          // 能看到封面时隐藏折叠按钮并收起侧栏；滚过封面或进入文档页后按用户偏好恢复。
          var coverWasInView = null;
          var isMobileDrawer = function () {
            return window.matchMedia("(max-width: 768px)").matches;
          };
          var clearDocsifyInlineLayout = function () {
            var content = document.querySelector(".content");
            if (content) {
              content.style.transform = "";
              content.style.left = "";
              content.style.width = "";
            }
            var sidebar = document.querySelector(".sidebar");
            if (sidebar) {
              sidebar.style.transform = "";
              sidebar.style.left = "";
              sidebar.style.width = "";
            }
          };
          var applySidebarCollapsed = function (collapsed, persist) {
            document.body.classList.toggle("sidebar-collapsed", collapsed);
            document.body.classList.remove("close");
            if (collapsed) document.documentElement.setAttribute("data-sidebar-collapsed", "1");
            else document.documentElement.removeAttribute("data-sidebar-collapsed");
            if (persist !== false) {
              try { localStorage.setItem("kb-sidebar-collapsed", collapsed ? "1" : "0"); } catch (e) {}
            }
            clearDocsifyInlineLayout();
          };

          function preferredCollapsed() {
            try {
              return localStorage.getItem("kb-sidebar-collapsed") !== "0";
            } catch (e) {
              return true;
            }
          }

          function isCoverInView() {
            var cover = document.querySelector("section.cover.show");
            return !!cover && cover.getBoundingClientRect().bottom > 0;
          }

          function syncCoverToggleVisibility() {
            var coverInView = isCoverInView();
            document.body.classList.toggle("kb-cover-visible", coverInView);
            if (isMobileDrawer()) return;
            if (coverWasInView === coverInView) return;
            coverWasInView = coverInView;
            if (coverInView) applySidebarCollapsed(true, false);
            else applySidebarCollapsed(preferredCollapsed(), false);
          }

          function bindDocsifyToggle() {
            var docsifyToggle = document.querySelector(".sidebar-toggle");
            if (!docsifyToggle || docsifyToggle.dataset.kbBound) return;
            docsifyToggle.dataset.kbBound = "1";
            docsifyToggle.addEventListener("click", function (event) {
              event.preventDefault();
              event.stopImmediatePropagation();
              applySidebarCollapsed(!document.body.classList.contains("sidebar-collapsed"));
              setTimeout(function () {
                document.body.classList.remove("close");
                clearDocsifyInlineLayout();
              }, 0);
            }, true);
          }

          function bindSidebarNavClicks() {
            var sidebarEl = document.querySelector(".sidebar");
            if (!sidebarEl || sidebarEl.dataset.kbClickBound) return;
            sidebarEl.dataset.kbClickBound = "1";
            sidebarEl.addEventListener("click", function (event) {
              if (!isMobileDrawer()) return;
              var target = event.target && event.target.closest ? event.target : null;
              if (!target) return;
              if (target.closest(".kb-tag[data-tag]")) return;
              if (target.closest(".kb-search-brand, .kb-result-item[data-path]")) {
                applySidebarCollapsed(true);
                return;
              }
              var link = target.closest(".sidebar-nav a");
              if (!link) return;
              var parent = link.parentElement;
              if (parent && parent.classList.contains("folder")) return;
              var href = link.getAttribute("href") || "";
              if (href.charAt(0) === "#") applySidebarCollapsed(true);
            });
          }

          hook.doneEach(function () {
            coverWasInView = null;
            bindDocsifyToggle();
            bindSidebarNavClicks();
            clearDocsifyInlineLayout();
            setTimeout(syncCoverToggleVisibility, 0);
          });

          hook.mounted(function () {
            var sidebarToggle = document.createElement("button");
            sidebarToggle.className = "sidebar-collapse-toggle";
            sidebarToggle.type = "button";
            sidebarToggle.setAttribute("aria-label", "展开目录");
            sidebarToggle.innerHTML = "›";

            var prevApply = applySidebarCollapsed;
            applySidebarCollapsed = function (collapsed, persist) {
              prevApply(collapsed, persist);
              sidebarToggle.innerHTML = collapsed ? "›" : "‹";
              sidebarToggle.setAttribute("aria-label", collapsed ? "展开目录" : "收起目录");
              sidebarToggle.title = collapsed ? "展开目录" : "收起目录";
            };

            window.addEventListener("scroll", syncCoverToggleVisibility, { passive: true });
            window.addEventListener("resize", syncCoverToggleVisibility);
            window.addEventListener("hashchange", function () {
              coverWasInView = null;
              setTimeout(syncCoverToggleVisibility, 0);
            });

            sidebarToggle.addEventListener("click", function () {
              applySidebarCollapsed(!document.body.classList.contains("sidebar-collapsed"));
            });
            document.body.appendChild(sidebarToggle);

            bindDocsifyToggle();
            setTimeout(bindDocsifyToggle, 0);

            var sidebarDim = document.getElementById("kb-sidebar-dim");
            if (!sidebarDim) {
              sidebarDim = document.createElement("div");
              sidebarDim.id = "kb-sidebar-dim";
              sidebarDim.className = "kb-sidebar-dim";
              sidebarDim.setAttribute("aria-hidden", "true");
              document.body.appendChild(sidebarDim);
            }
            sidebarDim.addEventListener("click", function (event) {
              if (event.target.closest && event.target.closest(".sidebar, .sidebar-toggle")) return;
              applySidebarCollapsed(true);
            });

            bindSidebarNavClicks();
            syncCoverToggleVisibility();

            var btn = document.createElement("button");
            btn.className = "theme-toggle";
            btn.title = "切换深色/浅色模式";
            btn.innerHTML =
              '<span class="icon-moon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg></span>' +
              '<span class="icon-sun"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg></span>';
            btn.addEventListener("click", function () {
              var current =
                document.documentElement.getAttribute("data-theme");
              var next = current === "dark" ? "light" : "dark";
              document.documentElement.setAttribute("data-theme", next);
              try { localStorage.setItem("kb-theme", next); } catch (e) {}
              if (window.kbRerenderMermaid) window.kbRerenderMermaid();
            });
            document.body.appendChild(btn);
          });
        },
        function (hook) {
          function wrapFolderLabels() {
            document.querySelectorAll(".sidebar-nav li.folder").forEach(function (li) {
              if (li.querySelector(":scope > .kb-folder-label, :scope > a, :scope > p")) return;
              var labelText = "";
              var child = li.firstChild;
              while (child) {
                var next = child.nextSibling;
                if (child.nodeType === 3) {
                  labelText += child.textContent;
                  li.removeChild(child);
                } else if (child.nodeType === 1 && child.tagName !== "UL") {
                  return;
                }
                child = next;
              }
              labelText = labelText.replace(/\s+/g, " ").trim();
              if (!labelText) return;
              var label = document.createElement("span");
              label.className = "kb-folder-label";
              label.textContent = labelText;
              var ul = li.querySelector(":scope > ul");
              li.insertBefore(label, ul);
            });
          }

          function scrollActiveNavIntoView() {
            var nav = document.querySelector(".sidebar-nav");
            if (!nav) return;
            var active =
              nav.querySelector(".app-sub-sidebar li.active > a") ||
              nav.querySelector("li.active > a");
            if (!active) return;
            var navRect = nav.getBoundingClientRect();
            var rect = active.getBoundingClientRect();
            if (rect.top < navRect.top + 8 || rect.bottom > navRect.bottom - 8) {
              active.scrollIntoView({ block: "nearest", inline: "nearest" });
            }
          }

          hook.doneEach(function () {
            var sidebar = document.querySelector(".sidebar");
            if (sidebar && !sidebar.querySelector(".sidebar-tools")) {
              var tools = document.createElement("div");
              tools.className = "sidebar-tools";
              tools.setAttribute("role", "group");
              tools.setAttribute("aria-label", "展开或收起目录");
              tools.innerHTML =
                '<button class="sidebar-tool" type="button" data-sidebar-action="expand" title="展开全部分类">展开</button>' +
                '<button class="sidebar-tool" type="button" data-sidebar-action="collapse" title="收起全部分类">收起</button>';
              sidebar.insertBefore(tools, sidebar.querySelector(".sidebar-nav"));
              tools.addEventListener("click", function (event) {
                var btn = event.target.closest("[data-sidebar-action]");
                if (!btn) return;
                var expand = btn.getAttribute("data-sidebar-action") === "expand";
                document.querySelectorAll(".sidebar-nav li.folder").forEach(function (item) {
                  item.classList.toggle("open", expand);
                  item.classList.toggle("collapse", !expand);
                });
                if (!expand) {
                  document.querySelectorAll(".sidebar-nav li.file.open").forEach(function (item) {
                    item.classList.remove("open");
                  });
                  document.querySelectorAll(".sidebar-nav ul.app-sub-sidebar").forEach(function (ul) {
                    ul.classList.remove("open");
                  });
                }
                var nav = document.querySelector(".sidebar-nav");
                if (nav) nav.scrollTop = 0;
              });
            }
            wrapFolderLabels();
            setTimeout(scrollActiveNavIntoView, 0);
          });
        },
        kbSearchPlugin,
        kbKatexPlugin,
      ],
    };
  </script>
  <script src="//cdn.jsdelivr.net/npm/mermaid@9/dist/mermaid.min.js"></script>
  <script>
    (function () {
      function mermaidThemeVars(isDark) {
        if (isDark) {
          return {
            primaryColor: "#1e3a5f",
            primaryTextColor: "#f1f5f9",
            primaryBorderColor: "#60a5fa",
            lineColor: "#94a3b8",
            secondaryColor: "#1e293b",
            tertiaryColor: "#0f172a",
            background: "#1e293b",
            mainBkg: "#1e3a5f",
            nodeBorder: "#60a5fa",
            clusterBkg: "#0f172a",
            clusterBorder: "#334155",
            titleColor: "#f1f5f9",
            textColor: "#f1f5f9",
            nodeTextColor: "#f1f5f9",
            tertiaryTextColor: "#f1f5f9",
            edgeLabelBackground: "#1e293b",
          };
        }
        return {
          primaryColor: "#dbeafe",
          primaryTextColor: "#1e3a8a",
          primaryBorderColor: "#2c7be5",
          lineColor: "#64748b",
          secondaryColor: "#eff6ff",
          tertiaryColor: "#f8fafc",
          background: "#f8fafc",
          mainBkg: "#dbeafe",
          nodeBorder: "#2c7be5",
          clusterBkg: "#f8fafc",
          clusterBorder: "#bfdbfe",
          titleColor: "#1e3a8a",
          textColor: "#1e3a8a",
          nodeTextColor: "#1e3a8a",
          tertiaryTextColor: "#1e3a8a",
          edgeLabelBackground: "#ffffff",
        };
      }

      function mermaidThemeCSS(isDark) {
        var color = isDark ? "#e2e8f0" : "#1a202c";
        return ".node .label,.nodeLabel,.cluster-label,.cluster-label span{color:" + color + "}";
      }

      function applyMermaidConfig() {
        if (!window.mermaid) return;
        var isDark = document.documentElement.getAttribute("data-theme") === "dark";
        window.mermaid.initialize({
          startOnLoad: false,
          theme: "base",
          themeVariables: mermaidThemeVars(isDark),
          themeCSS: mermaidThemeCSS(isDark),
        });
      }

      window.kbRenderMermaid = function () {
        if (!window.mermaid) return;
        document.querySelectorAll(".markdown-section .mermaid").forEach(function (el) {
          if (!el.getAttribute("data-kb-source")) {
            el.setAttribute("data-kb-source", el.textContent);
          }
        });
        applyMermaidConfig();
        window.mermaid.init(undefined, ".mermaid:not([data-processed])");
      };

      window.kbRerenderMermaid = function () {
        if (!window.mermaid) return;
        document.querySelectorAll(".markdown-section .mermaid").forEach(function (el) {
          var src = el.getAttribute("data-kb-source");
          if (!src) return;
          el.removeAttribute("data-processed");
          el.removeAttribute("id");
          el.textContent = src;
        });
        applyMermaidConfig();
        window.mermaid.init(undefined, ".mermaid:not([data-processed])");
      };

      applyMermaidConfig();
    })();
  </script>
